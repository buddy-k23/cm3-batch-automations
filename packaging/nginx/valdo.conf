# =============================================================================
# Valdo MCP — nginx reverse-proxy + TLS termination (S9-1, #387)
# =============================================================================
# Target: nginx 1.20+ on RHEL 8 / RHEL 9.
# Shipped by the RPM to: /etc/nginx/conf.d/valdo.conf.sample
#
# This config is a SAMPLE. The RPM installs it as *.sample so it never
# overwrites a hand-tuned production conf. To activate:
#
#   sudo cp /etc/nginx/conf.d/valdo.conf.sample /etc/nginx/conf.d/valdo.conf
#   # edit the <PLACEHOLDER> values below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Full walkthrough (cert request -> install -> validate -> renew) lives in
# docs/PRODUCTION_DEPLOYMENT.md, section "## TLS + nginx (S9-1)".
#
# PLACEHOLDERS you MUST edit before activating (no real bank hostnames are
# baked in, per Architecture Principle #5 — nothing host-specific hardcoded):
#   * server_name              -> your FQDN (e.g. valdo.bank.internal)
#   * ssl_certificate          -> path to the cert chain from the PKI team
#   * ssl_certificate_key      -> path to the matching private key
#   * the upstream "valdo_mcp" address/port if not the default 127.0.0.1:8000
# =============================================================================

# Upstream = the gunicorn/uvicorn worker pool serving src.api.main:app.
# Single-host topology: nginx and the app run on the same box, app bound to
# loopback so only nginx (not the network) can reach it. With this topology
# leave VALDO_MCP_TRUSTED_PROXIES at its default (127.0.0.1) so FastAPI's
# ProxyHeadersMiddleware trusts the X-Forwarded-For nginx sets below.
upstream valdo_mcp {
    # <PLACEHOLDER> — change to the app's bind address:port if not loopback.
    server 127.0.0.1:8000;
    keepalive 32;
}

# $connection_upgrade maps the Upgrade header to the right Connection value
# for WebSocket / streaming pass-through. Declared here (http{} context, via
# the conf.d include) BEFORE the server blocks that reference it. If you
# already define this in a shared proxy snippet, delete this block to avoid a
# duplicate-map error at `nginx -t`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----- gzip (text/JSON responses; MCP JSON-RPC bodies compress well) --------
gzip               on;
gzip_vary          on;
gzip_proxied       any;
gzip_comp_level    5;
gzip_min_length    1024;
gzip_types
    application/json
    application/javascript
    application/xml
    text/css
    text/plain
    text/yaml;

# ----- HTTP :80 -> redirect everything to HTTPS -----------------------------
server {
    listen      80;
    listen      [::]:80;
    # <PLACEHOLDER> — your FQDN.
    server_name valdo.bank.internal;

    # Allow ACME http-01 challenge if you use certbot (see runbook).
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/nginx/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ----- HTTPS :443 — TLS termination + proxy to the app ----------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;                       # nginx 1.25+ syntax; on 1.20–1.24
                                          # use `listen 443 ssl http2;` above
                                          # and delete this line.
    # <PLACEHOLDER> — your FQDN. Must match the cert's CN / SAN.
    server_name valdo.bank.internal;

    # --- TLS material (from the bank PKI team; see runbook) -----------------
    # <PLACEHOLDER> — full chain (leaf + intermediates), then the key.
    ssl_certificate     /etc/pki/tls/certs/valdo.crt;
    ssl_certificate_key /etc/pki/tls/private/valdo.key;

    # Modern, FIPS-friendly TLS posture. TLS 1.2 + 1.3 only.
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache          shared:VALDO_SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # OCSP stapling — enable once the PKI team confirms an OCSP responder.
    # ssl_stapling           on;
    # ssl_stapling_verify    on;
    # ssl_trusted_certificate /etc/pki/tls/certs/valdo-ca-chain.crt;
    # resolver               127.0.0.1 valid=300s;

    # --- Security response headers -----------------------------------------
    # HSTS: force HTTPS for 1 year. Only enable once you are certain the FQDN
    # will ALWAYS be HTTPS — it is sticky in browsers. Drop `preload` unless
    # you have submitted the domain to the HSTS preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Body size — MCP can ship workbooks/sample files for onboarding tools.
    client_max_body_size 32m;

    # --- /mcp/ — the MCP Streamable-HTTP surface ----------------------------
    location /mcp/ {
        proxy_pass         http://valdo_mcp;
        proxy_http_version 1.1;

        # Forwarded headers — FastAPI's ProxyHeadersMiddleware reads these to
        # recover the REAL client IP + scheme (see VALDO_MCP_TRUSTED_PROXIES).
        # $proxy_add_x_forwarded_for appends the client to any upstream chain.
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Port   $server_port;
        proxy_set_header   Host               $host;

        # WebSocket / streaming upgrade — MCP Streamable-HTTP may hold a
        # long-lived response stream (SSE-style). These headers let nginx
        # pass an Upgrade handshake through and keep the connection open.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Don't buffer streamed JSON-RPC responses; flush as the app writes.
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Load-balancer / readiness probe ------------------------------------
    # S9-2 (#390) wires /mcp/health as the upstream probe target. Until then
    # this proxies to the existing FastAPI health endpoint.
    location = /healthz {
        proxy_pass         http://valdo_mcp/api/v1/system/health;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # --- Everything else (UI, /api, /docs) ----------------------------------
    location / {
        proxy_pass         http://valdo_mcp;
        proxy_http_version 1.1;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   Host               $host;
    }
}

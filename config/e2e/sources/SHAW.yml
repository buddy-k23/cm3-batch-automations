# Valdo E2E Batch Testing — Per-Source Configuration: SHAW
#
# Onboarded per prompts/e2e_batch_testing_README.md (5-step add-a-source
# checklist). Decisions captured in
# docs/handover/SHAW_source_onboarding_session.md.
#
# Hard rules respected:
#   - No secrets in this file (USRPW etc. inherited from .env by load wrapper).
#   - No modifications under src/ — config + scripts only.

schema_version: 1
source: SHAW
release_tag: "2026.M06"
description: "SHAW source onboarding — first iteration."

# ---------------------------------------------------------------------------
# Source-level overrides (forward-looking schema F1 / F1b)
#
# These two fields override the corresponding values in
# config/e2e/paths.yml::envs.<env>.* for this source only. Both are honored
# by scripts/e2e_lib/path_resolver.py. Same values apply to sit and ait.
# ---------------------------------------------------------------------------
staging_schema: "APP_INT"
output_root:    "/app/software/APPS/ftp/input/shaw"

# Shell scripts the harness shells out to when invoke_java=true on a gate.
# SHAW has no Java generate script in this iteration — generate gate is
# disabled (see `gates:` below). `load` points at the deployed wrapper on
# the RHEL host (sourced from scripts/wrappers/load_SHAW.sh in this repo).
java_scripts:
  load: "/app/software/APPS/valdo/scripts/wrappers/load_SHAW.sh"

# ---------------------------------------------------------------------------
# Staging tables associated with this source.
#
# Bare table names; the source-level `staging_schema: "APP_INT"` override
# above qualifies them at resolution time. Mirrors the 6 input_files entries
# below — the only files currently delivered by SHAW for this iteration.
# Remaining sqlload scripts in load_SHAW.sh are load-only (no input file
# delivered yet) and gain file_to_staging coverage in a follow-up MR.
# ---------------------------------------------------------------------------
staging_tables:
  - SHAW_COLLATERAL
  - SHAW_FEE_MASTER
  - SHAW_LOAN_MASTER
  - SHAW_LOANS_NAME
  - SHAW_TRANSACTIONS
  - SHAW_TRANS_MASTER

# ---------------------------------------------------------------------------
# Input files received from SHAW. Drive the file_to_staging gate.
# thresholds.max_errors defaults to 0 (zero tolerance for load drift) per
# the EA-S1 Pydantic model; EA-S2 emits it as a `# default:` comment in the
# generated pipeline YAML.
# ---------------------------------------------------------------------------
input_files:
  - file_type: COLLATERAL_MASTER
    glob: "collateral-master_*.txt"
    mapping: "config/mappings/SHAW_COLLATERAL_MASTER.json"  # TODO(mapping-pending)
    target_staging_table: "SHAW_COLLATERAL"

  - file_type: FEE_MASTER
    glob: "fee-master_*.txt"
    mapping: "config/mappings/SHAW_FEE_MASTER.json"  # TODO(mapping-pending)
    target_staging_table: "SHAW_FEE_MASTER"

  - file_type: LOAN_MASTER
    glob: "loans-master_*.txt"
    mapping: "config/mappings/SHAW_LOAN_MASTER.json"  # TODO(mapping-pending)
    target_staging_table: "SHAW_LOAN_MASTER"

  - file_type: LOANS_NAME
    glob: "loans-name_*.txt"
    mapping: "config/mappings/SHAW_LOANS_NAME.json"  # TODO(mapping-pending)
    target_staging_table: "SHAW_LOANS_NAME"

  - file_type: POSTED_TRANS
    glob: "posted-trans_*.txt"
    mapping: "config/mappings/SHAW_POSTED_TRANS.json"  # TODO(mapping-pending)
    target_staging_table: "SHAW_TRANSACTIONS"

  - file_type: TRANS_MASTER
    glob: "history_*.txt"
    mapping: "config/mappings/SHAW_TRANS_MASTER.json"  # TODO(mapping-pending)
    target_staging_table: "SHAW_TRANS_MASTER"

# ---------------------------------------------------------------------------
# Output files generated by the SHAW batch. Drive L1/L2/L3 gates.
#
# Filenames are lowercase by design (Question A option (b)): the watcher
# regex in paths.yml is not relied on for outputs; each entry's `glob`
# matches directly under `output_root`.
#
# Multi-record handling (post EB-S1 / ADR 0005): dispatch is **inferred**
# from the mapping file extension. Umbrella YAML mapping (`.yaml`) -> the
# file is multi-record; flat JSON mapping (`.json`) -> single record. The
# umbrella YAML itself declares the discriminator field name and per-record
# layouts. The legacy `multi_record:` and `discriminator_field:` keys are
# no longer accepted on output_files[] entries (rejected by
# OutputFileConfig with an actionable ValidationError).
#   - atoctran_shaw_*.txt  -> umbrella SHAW_ATOCTRAN.yaml
#     (TRANSACTION-CODE; values 100, 200, 300, 605, 700, 900, 060)
#   - tranert_shaw_*.txt   -> umbrella SHAW_TRANERT.yaml
#     (TRN-COD-ERT; position 170, length 5; Batch Header matched
#     by position: "first"; codes 32000/32001 (NEW1), 32005 (CUS),
#     32010 (ORI), 32025 (COD), 32040 (CBRS), 32075 (REC);
#     32030 (VR) and 32070 (CON) pending)
#   - contact_shaw_*.txt   -> flat SHAW_CONTACT.json (umbrella deferred
#     pending CONTACT spec workbook; flip to *.yaml when ready)
# ---------------------------------------------------------------------------
output_files:
  - file_type: ATOCTRAN
    glob: "atoctran_shaw_*.txt"
    # Multi-record umbrella: 7 record types (100, 200, 300, 605, 700, 900,
    # 060) dispatched by TRANSACTION-CODE at positions 25-27. The umbrella
    # YAML references one mapping JSON and one rules JSON per record type;
    # rules: is left empty here because per-record rules are inside the
    # umbrella. Pipeline-YAML wiring for multi-record dispatch is a
    # follow-up MR (generate_pipeline_yaml.py change).
    mapping: "config/mappings/SHAW_ATOCTRAN.yaml"
    rules:   ""

  - file_type: CDSTRANS_EAC_COLLATERAL
    glob: "cdstrans_eac_collateral_shaw_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_EAC_COLLATERAL.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_EAC_COLLATERAL.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_EFB
    glob: "cdstrans_efb_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_EFB.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_EFB.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_EFI
    glob: "cdstrans_efi_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_EFI.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_EFI.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_EFW_FEE_WAIVERS
    glob: "cdstrans_efw_fee_waivers_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_EFW_FEE_WAIVERS.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_EFW_FEE_WAIVERS.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_EFX
    glob: "cdstrans_efx_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_EFX.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_EFX.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_ESA
    glob: "cdstrans_esa_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_ESA.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_ESA.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_EST
    glob: "cdstrans_est_shaw_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_EST.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_EST.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_HSS
    glob: "cdstrans_hss_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_HSS.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_HSS.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_RLT
    glob: "cdstrans_rlt_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_RLT.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_RLT.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_SEC
    glob: "cdstrans_sec_shaw_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_SEC.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_SEC.json"     # TODO(rules-pending)

  - file_type: CDSTRANS_XPR
    glob: "cdstrans_xpr_*.txt"
    mapping: "config/mappings/SHAW_CDSTRANS_XPR.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CDSTRANS_XPR.json"     # TODO(rules-pending)

  - file_type: CONTACT
    glob: "contact_shaw_*.txt"
    mapping: "config/mappings/SHAW_CONTACT.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CONTACT.json"     # TODO(rules-pending)
    # Mapping currently flat .json -> is_multi_record inferred as false
    # until the CONTACT spec workbook lands and a MultiRecordConfig
    # umbrella YAML is produced (open follow-up #5 in
    # docs/handover/SHAW_source_onboarding_session.md). Per ADR 0005 / EB-S1
    # the dispatch flag is inferred from the mapping extension: flat .json
    # -> single record; umbrella .yaml -> multi-record. Flip by pointing
    # `mapping` at SHAW_CONTACT.yaml once the umbrella exists; no flag
    # edits needed here. Discriminator field (RECORD_TYPE, TBC) will live
    # inside the umbrella YAML.

  - file_type: CONTACT_ACCOUNT
    glob: "contact-account_shaw_*.txt"
    mapping: "config/mappings/SHAW_CONTACT_ACCOUNT.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_CONTACT_ACCOUNT.json"     # TODO(rules-pending)

  - file_type: P327
    glob: "p327_shaw_*.txt"
    mapping: "config/mappings/SHAW_P327.json"  # TODO(mapping-pending)
    rules:   "config/rules/SHAW_P327.json"     # TODO(rules-pending)

  - file_type: TRANERT
    glob: "tranert_shaw_*.txt"
    # Multi-record umbrella: 8 record types dispatched by TRN-COD-ERT at
    # position 170-174 (5 chars). Batch Header matched by position: "first".
    # NEW1 covers two codes (32000 = NAS, 32001 = EAS). Cross-type rule:
    # ITM-CNT-BRT (Batch Header) must equal total detail record count.
    # VR (32030) and CON (32070) layout sheets pending BA authoring.
    # Discriminator confirmed 2026-05-22 from TRANERT_SHAW_Mappings.xlsx.
    mapping: "config/mappings/SHAW_TRANERT.yaml"
    rules:   ""

# ---------------------------------------------------------------------------
# Per-gate blocking + Java invocation policy for SHAW.
#
# Question 6 decisions (see docs/handover/SHAW_source_onboarding_session.md):
#   - generate_step: disabled (no Java generate script this iteration).
#   - L3_baseline_diff: blocking — will fail every run until step 5 of the
#     README (first baseline promotion) is complete. Accepted.
# ---------------------------------------------------------------------------
gates:
  load_step:        { blocking: true,  invoke_java: true  }
  file_to_staging:  { blocking: true,  invoke_java: false }
  generate_step:    { blocking: false, invoke_java: false }
  L1_structural:    { blocking: true,  invoke_java: false }
  # L2_regeneration retired (ADR 0012); L2b SQL-truth + L3 cover output truth.
  L3_baseline_diff: { blocking: true,  invoke_java: false }
  # L2b SQL-truth reconciliation: SHAW TRANERT ships a reconciliation YAML
  # (config/e2e/sources/SHAW/reconciliation/tranert.yml), so this gate is
  # enabled and blocking. Driven by the orchestrator's db_truth_comparator,
  # NOT via valdo run-etl-pipeline; invoke_java stays false.
  L2b_sql_truth:    { blocking: true,  invoke_java: false }
  # Multi-record validation HTML report: renders per-record-type subpages
  # (standard ValidationReporter output, incl. per-type mapping + business
  # rules such as the CIF-REF-NUM-CUS countdown) plus a cumulative umbrella
  # index, for every multi_record output file (TRANERT, ATOCTRAN). A REPORT,
  # not a pass/fail gate (the rule failures are gated by L1_structural), so
  # non-blocking. suppress_pii defaults to false per AGENTS.md hard rule #4.
  multi_record_report: { blocking: false, invoke_java: false }

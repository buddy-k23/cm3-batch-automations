# Valdo E2E Batch Testing — Per-Source Configuration: SRC_A
#
# One file per source under config/e2e/sources/. Loaded by the path resolver
# and the pipeline-YAML generator (M3). The schema here is intentionally flat
# and human-editable so QA can add a new source by copy-paste-edit.

schema_version: 1
source: SRC_A
release_tag: "R2026.05"
description: "Sample profile for SRC_A used as the M1 reference."

# Shell scripts the harness shells out to when invoke_java=true on a gate.
# Both are optional; omit when the gate's invoke_java is false.
java_scripts:
  load:     "/apps/batch/bin/load_SRC_A.sh"
  generate: "/apps/batch/bin/generate_SRC_A.sh"

# Staging tables associated with this source (used by the file-to-staging gate
# in M3+). Minimum 5 per source per the design.
staging_tables:
  - STG_SRC_A_HEADER
  - STG_SRC_A_TXN
  - STG_SRC_A_PARTY
  - STG_SRC_A_ADDR
  - STG_SRC_A_AUDIT

# Input files received from the source. Each entry drives the file→staging
# comparison gate.
input_files:
  - file_type: HEADER
    glob: "SRC_A_input_HEADER_*.dat"
    mapping: "config/mappings/SRC_A_input_HEADER.json"
    target_staging_table: "STG_SRC_A_HEADER"
    thresholds:
      max_errors: 0
  - file_type: TXN
    glob: "SRC_A_input_TXN_*.dat"
    mapping: "config/mappings/SRC_A_input_TXN.json"
    target_staging_table: "STG_SRC_A_TXN"
    thresholds:
      max_errors: 0
  - file_type: PARTY
    glob: "SRC_A_input_PARTY_*.dat"
    mapping: "config/mappings/SRC_A_input_PARTY.json"
    target_staging_table: "STG_SRC_A_PARTY"
    thresholds:
      max_errors: 0

# Output files generated by the Java batch. Each entry drives the L1/L2/L3
# comparison layers.
output_files:
  - file_type: P327
    glob: "SRC_A_P327_*.txt"
    mapping: "config/mappings/SRC_A_P327.json"
    rules:   "config/rules/SRC_A_P327.json"
    multi_record: false
    strict_fixed_width: true
    strict_level: all
    tolerance:
      ignore_fields: ["FILE_CREATE_TS", "BATCH_SEQ_NO"]
      max_error_pct: 0
      max_errors: 0

  - file_type: P328
    glob: "SRC_A_P328_*.txt"
    mapping: "config/mappings/SRC_A_P328.json"
    rules:   "config/rules/SRC_A_P328.json"
    # multi_record: false — P328 was previously flagged true with a flat
    # .json mapping; per ADR 0005 the flag must match the mapping format.
    # When P328 acquires a real MultiRecordConfig umbrella, flip this back
    # to true and point mapping at the .yaml umbrella.
    multi_record: false
    strict_fixed_width: true
    strict_level: all
    tolerance:
      ignore_fields: ["FILE_CREATE_TS"]
      max_error_pct: 0
      max_errors: 0

  - file_type: P329
    glob: "SRC_A_P329_*.txt"
    mapping: "config/mappings/SRC_A_P329.json"
    rules:   "config/rules/SRC_A_P329.json"
    # multi_record: see P328 — flag corrected to match flat .json mapping.
    multi_record: false
    strict_fixed_width: true
    strict_level: all
    tolerance:
      ignore_fields: ["FILE_CREATE_TS"]
      max_error_pct: 0
      max_errors: 0

  - file_type: P330
    glob: "SRC_A_P330_*.txt"
    mapping: "config/mappings/SRC_A_P330.json"
    rules:   "config/rules/SRC_A_P330.json"
    # multi_record: see P328 — flag corrected to match flat .json mapping.
    multi_record: false
    strict_fixed_width: true
    strict_level: all
    tolerance:
      ignore_fields: ["FILE_CREATE_TS"]
      max_error_pct: 0
      max_errors: 0

  - file_type: P331
    glob: "SRC_A_P331_*.txt"
    mapping: "config/mappings/SRC_A_P331.json"
    rules:   "config/rules/SRC_A_P331.json"
    # multi_record: see P328 — flag corrected to match flat .json mapping.
    multi_record: false
    strict_fixed_width: true
    strict_level: all
    tolerance:
      ignore_fields: ["FILE_CREATE_TS"]
      max_error_pct: 0
      max_errors: 0

  - file_type: P332
    glob: "SRC_A_P332_*.txt"
    mapping: "config/mappings/SRC_A_P332.json"
    rules:   "config/rules/SRC_A_P332.json"
    multi_record: false
    strict_fixed_width: true
    strict_level: all
    tolerance:
      ignore_fields: ["FILE_CREATE_TS"]
      max_error_pct: 0
      max_errors: 0

# Per-gate blocking + Java invocation policy for this source. Every gate
# referenced by the pipeline YAML generator (M3) must appear here.
gates:
  load_step:        { blocking: true,  invoke_java: true  }
  file_to_staging:  { blocking: true,  invoke_java: false }
  generate_step:    { blocking: true,  invoke_java: true  }
  L1_structural:    { blocking: true,  invoke_java: false }
  # L2_regeneration retired (ADR 0012); L2b SQL-truth + L3 cover output truth.
  L3_baseline_diff: { blocking: false, invoke_java: false }
  # L2b SQL-truth reconciliation: non-blocking until this source authors its
  # own reconciliation YAML under config/e2e/sources/SRC_A/reconciliation/.
  # The gate records 'l2b_not_configured' and skips while no YAML exists.
  L2b_sql_truth:    { blocking: false, invoke_java: false }

# GitLab pipeline secret detection — custom ruleset.
#
# This file tells the GitLab secret-detection analyzer to use an extended
# gitleaks configuration committed alongside it. The extended config keeps
# every default rule active (via `[extend] useDefault = true`) and adds an
# `[allowlist]` block that excludes well-known placeholder / test-fixture
# paths whose content is intentionally non-secret.
#
# Background:
#   - `.env.example` ships documentation-style placeholders (e.g. `change-me`).
#   - The LDAPS test fixtures (`tests/e2e/conftest.py`,
#     `scripts/smoke_test_ldap_login.py`) inject deterministic fake values
#     for `VALDO_SESSION_SIGNING_KEY` and `LDAP_SERVICE_PASSWORD` only into
#     a transient uvicorn subprocess used by E2E tests — they are never
#     written to disk outside the test run and are not real credentials.
#   - The unit-test suite uses the literal placeholder string `[REDACTED]`
#     as a test API key (and the older `dev-key` pattern) so tests can call
#     the API without exposing real keys.
#   - `src/reports/static/chart.umd.min.js` is the vendored Chart.js bundle;
#     gitleaks high-entropy rules can flag minified base64-ish substrings
#     inside it.
#
# Without these exclusions the verify-policy-scans job blocks every MR on a
# baseline of >24 pre-existing High/Critical findings that are not real
# secrets, forcing per-MR manual triage. Excluding the known-safe paths
# moves the gate to "any NEW finding from real source / config" only.
#
# Reference: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/#ignore-patterns-and-paths

[secrets]
  [[secrets.passthrough]]
    type   = "file"
    target = "gitleaks.toml"
    value  = ".extended-gitleaks-config.toml"

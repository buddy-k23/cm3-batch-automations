<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <title>Sign in &mdash; Valdo</title>
  <script>
    /* Apply saved theme before first paint to avoid flash — mirrors ui.html */
    (function () {
      var t = localStorage.getItem('valdo-theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      } else {
        var preferLight = window.matchMedia
          && window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', preferLight ? 'light' : 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/ui.css">
  <style>
    /* Login-only layout. All colors come from the shared theme variables in
       ui.css so light/dark mode follows the rest of the app. */
    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      border-radius: 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .login-brand h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .login-brand .version-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-tertiary, var(--bg-primary));
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }
    .login-card .muted {
      color: var(--text-muted);
      margin: 0 0 20px 0;
      font-size: 14px;
    }
    .login-card label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin: 14px 0 6px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .login-card input[type="text"],
    .login-card input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--bg-primary);
      color: var(--text-primary);
      box-sizing: border-box;
      font-size: 14px;
      font-family: inherit;
    }
    .login-card input:focus {
      outline: 2px solid var(--accent, #2563eb);
      outline-offset: 1px;
      border-color: transparent;
    }
    .login-card .btn-primary {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      border-radius: 6px;
      border: none;
      background: var(--accent, #2563eb);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.05s;
    }
    .login-card .btn-primary:hover { opacity: 0.9; }
    .login-card .btn-primary:active { transform: translateY(1px); }
    .login-card .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .login-card .err {
      margin-top: 12px;
      color: var(--error, #dc2626);
      font-size: 13px;
      min-height: 1.2em;
    }
    .login-card footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }
    .login-card footer code {
      font-size: 10px;
      background: var(--bg-primary);
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    /* Theme toggle pinned top-right, matches ui.html control. */
    .login-theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 16px;
    }
    .login-theme-toggle:hover { background: var(--bg-tertiary, var(--bg-secondary)); }
  </style>
</head>
<body class="login-shell">
  <button class="login-theme-toggle" id="btnTheme" aria-label="Toggle light/dark theme"
          title="Toggle theme">&#9728;</button>

  <main class="login-card" role="main" aria-label="Sign in">
    <div class="login-brand">
      <svg aria-hidden="true" focusable="false"
           width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="url(#valdo-icon-grad-login)" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="valdo-icon-grad-login" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <circle cx="11" cy="11" r="7.5"/>
        <line x1="17" y1="17" x2="22" y2="22"/>
        <line x1="9"  y1="11" x2="13" y2="11"/>
        <line x1="11" y1="9"  x2="11" y2="13"/>
      </svg>
      <h1>Valdo</h1>
      <span class="version-badge">v2.0</span>
    </div>
    <p class="muted">Sign in with your corporate account</p>

    <form id="loginForm" method="POST" action="/auth/login" autocomplete="on" novalidate>
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        required
        autocomplete="username"
        spellcheck="false"
        aria-required="true"
        autofocus
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        autocomplete="current-password"
        aria-required="true"
      >

      <input type="hidden" name="next" id="nextField" value="/ui">

      <button class="btn-primary" type="submit" id="submitBtn">Sign in</button>
      <div class="err" id="err" role="alert" aria-live="polite"></div>
    </form>

    <footer>
      Authenticated over LDAPS &middot;
      <code>ldaps://ldap-wil.bank.internal:636</code><br>
      Configured in <code>config/ui.yml</code> &rarr; <code>auth.ldap</code>
    </footer>
  </main>

  <script>
    // -------------------------------------------------------------------------
    // Theme toggle — persists to localStorage under the same key as ui.html
    // so a user's preference carries between login screen and dashboard.
    // -------------------------------------------------------------------------
    (function () {
      var btn = document.getElementById('btnTheme');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('valdo-theme', next); } catch (e) { /* ignore */ }
      });
    })();

    // -------------------------------------------------------------------------
    // Populate the hidden "next" field from the ?next= query parameter.
    // Only accept same-site relative paths (starts with / but not //).
    // -------------------------------------------------------------------------
    (function () {
      var p = new URLSearchParams(window.location.search);
      var nxt = p.get('next');
      if (nxt && nxt.charAt(0) === '/' && nxt.charAt(1) !== '/') {
        document.getElementById('nextField').value = nxt;
      }
    })();

    // -------------------------------------------------------------------------
    // Submit via fetch so we can render an inline error on 401 instead of a
    // full page reload. Falls back gracefully if fetch is unavailable.
    // -------------------------------------------------------------------------
    document.getElementById('loginForm').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var form = ev.currentTarget;
      var errEl = document.getElementById('err');
      var btn = document.getElementById('submitBtn');

      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Signing in\u2026';

      var data = new FormData(form);
      fetch('/auth/login', {
        method: 'POST',
        body: data,
        credentials: 'include',
        redirect: 'follow',
      })
        .then(function (r) {
          if (r.redirected) {
            window.location.href = r.url;
            return;
          }
          if (r.status === 401) {
            errEl.textContent = 'Invalid username or password.';
            btn.disabled = false;
            btn.textContent = 'Sign in';
            return;
          }
          errEl.textContent = 'Sign-in failed (HTTP ' + r.status + '). Please try again.';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        })
        .catch(function () {
          errEl.textContent = 'Network error. Please check your connection and try again.';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        });
    });
  </script>
</body>
</html>

name: Unit tests + coverage gate

# S13.5-5 (Sprint 13.5, #411) → S14-5 (Sprint 14, #416) → S17-4 (Sprint 17,
# #432): run the unit suite (tests/unit/) and the coverage gate
# (--cov-fail-under=80, configured in pytest.ini) on every PR/push. As of
# S17-4 the coverage gate is ENFORCED (no longer informational).
#
# BLOCKING ON TESTS: as of S14-5 (#416) this job is blocking on test pass/fail.
# The ~27 env-bound failures have been triaged to xfail/skip with documented
# reasons (and two real failures fixed), so the suite is green under the clean
# baseline CI conditions reproduced here (no local .env/valdo.db; dummy session
# signing key). The "Run unit tests" step no longer carries `continue-on-error`,
# so any TEST failure now fails the workflow.
#
# COVERAGE GATE IS ENFORCED (S17-4, #432): unit coverage under `--cov=src`
# is now >=80%, so the prior `--cov-fail-under=0` informational override has
# been removed. This job therefore blocks on BOTH test pass/fail AND the 80%
# coverage gate. The scope is reconciled: CI and local pytest.ini both use the
# single `--cov=src` whole-package scope, with the small, justified `omit` set
# living in `.coveragerc` (applied identically locally and in CI).
#
# NOTE: making this a *required* status check on `valdo-version-v4`/`main` is
# a GitHub branch-protection repo setting and must be enabled by a repo admin
# in Settings → Branches → branch protection rules. The workflow change here
# only makes the check itself go red on failure.

on:
  pull_request:
    branches:
      - valdo-version-v4
      - main
  push:
    branches:
      - valdo-version-v4
      - main

jobs:
  unit-tests:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest

    # CI-only DUMMY signing key. This is NOT a real secret -- it is a test
    # value so the ~24 API tests that need a session-cookie signer can run
    # in CI. CI checkout is clean, so no local .env/valdo.db is present
    # (those are gitignored), which is exactly the "true baseline" state:
    # the suite runs without local env overrides. Do not reuse this value
    # for any real deployment.
    env:
      VALDO_SESSION_SIGNING_KEY: ci-dummy-signing-key-not-a-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Editable install so `src` imports resolve the same way they do
        # for local developers. requirements.txt covers the full runtime
        # (pandas / pydantic / pyyaml / oracledb / fastapi / mcp ...) plus
        # pytest + pytest-cov, which is everything needed to import src and
        # run the unit suite. oracledb/pandas ship manylinux wheels, so no
        # extra system packages are required on ubuntu-latest. Lean by
        # design: unit tests only -- no server/DB, so integration/e2e are
        # not installed or run here.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run unit tests (blocking) + coverage gate (blocking)
        # BLOCKING ON TESTS (S14-5, #416) AND COVERAGE (S17-4, #432): no
        # continue-on-error, and no --cov-fail-under override — the 80% gate
        # from pytest.ini is enforced here. Either a test failure OR coverage
        # below 80% fails the workflow. Scope (`--cov=src`) + the .coveragerc
        # omit set match the local gate exactly.
        run: |
          pytest tests/unit/ --cov=src --cov-report=term-missing

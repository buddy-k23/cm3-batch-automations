name: Workbook drift check

# EC-S11 (Sprint 3): fail the build if any committed source onboarding
# workbook under templates/*_onboarding.xlsx drifts from the artefacts
# it would emit. The workbook must remain the single source of truth;
# nobody should land a manually-edited config/{mappings,rules}/<src>_*.json
# without first regenerating it from the workbook.
#
# The actual drift logic lives in scripts/check_workbook_drift.py so CI
# and local invocations cannot diverge.

on:
  pull_request:
    branches:
      - valdo-version-v4
      - main
  push:
    branches:
      - valdo-version-v4
      - main

jobs:
  workbook-drift-check:
    name: Workbook drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Editable install so `python -m src.main` resolves the CLI
        # entry point the same way it does for local developers. The
        # API requirements are included because src.main imports them
        # transitively (psutil, fastapi etc).
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Run workbook drift guardrail
        # Same script the local developer runs. The script discovers
        # every committed workbook, invokes `valdo onboard-source
        # --check` for each, and filters drift lines against
        # .github/workflows/workbook-drift-allowlist.txt. Exits non-zero
        # if any non-allowlisted drift line remains.
        run: bash scripts/check_workbook_drift.sh
